<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inkventure — device probe</title>
    <style>
      /* Deliberately minimal and old-browser safe: no flexbox, no custom properties. */
      body {
        margin: 0;
        padding: 16px;
        font-family: Georgia, serif;
        font-size: 18px;
        line-height: 1.4;
        color: #000;
        background: #fff;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 12px;
      }
      button {
        font: inherit;
        min-height: 48px;
        min-width: 48px;
        padding: 8px 16px;
        margin: 0 8px 8px 0;
        border: 2px solid #000;
        background: #fff;
      }
      #status {
        font-weight: bold;
      }
      #report {
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        border: 1px solid #000;
        padding: 8px;
      }
      #copy {
        width: 100%;
        height: 160px;
        font-family: 'Courier New', monospace;
        font-size: 12px;
      }
      #swipe {
        height: 120px;
        border: 2px dashed #000;
        margin: 0 0 12px;
        padding: 8px;
        text-align: center;
      }
      #qr img {
        width: 100%;
        max-width: 560px;
        height: auto;
        image-rendering: pixelated;
      }
      #app-frame {
        position: absolute;
        left: -2000px;
        top: 0;
        width: 600px;
        height: 800px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <h1>Inkventure — device probe</h1>
    <p>
      This page checks what your e-reader's browser can do. Wait until the status says
      <b>Done</b>, try the swipe box, then send the report (QR code or copied text).
    </p>
    <p id="status">Running…</p>
    <div id="swipe">Swipe or tap here (touch test)</div>
    <p>
      <button type="button" id="rerun">Run again</button>
      <button type="button" id="show-qr">Show QR code</button>
    </p>
    <div id="qr"></div>
    <pre id="report"></pre>
    <p>Copyable report:</p>
    <textarea id="copy" readonly></textarea>
    <script src="qrcode.js"></script>
    <script src="probe.js"></script>
  </body>
</html>
