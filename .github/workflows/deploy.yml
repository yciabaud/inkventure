name: Deploy to GitHub Pages

# Deploys main once its CI run has passed (lint, unit, build, es5, size and e2e gates), or on demand.
# The site is served from the gh-pages branch: main at its root, pull request previews under pr-preview/
# (see preview.yml), so this deployment must leave that folder alone.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit CI validated (workflow_run otherwise checks out the default branch head).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: npm run check:es5
      - run: npm run check:size
      # The Vite manifest is only used by check:size; don't publish it. Serve files as they are (no Jekyll).
      - run: rm -rf dist/.vite && touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          commit-message: Deploy ${{ github.event.workflow_run.head_sha || github.sha }}
