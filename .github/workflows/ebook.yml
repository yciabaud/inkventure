name: Ebook

# Builds the EN and FR ebooks (SPEC §8; story S6.1) on a version tag, on pull requests that change them, or on
# demand: EPUB 3 (Pandoc, checked with EPUBCheck) and AZW3 (Calibre), with game cards from the published catalogue's
# featured lists. The books are uploaded as a workflow artifact.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'ebook/**'
      - 'scripts/ebook/**'
      - '.github/workflows/ebook.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright's image with Pandoc, EPUBCheck and Calibre (.github/ebook-image, published by the Ebook image
    # workflow). Its tag must match @playwright/test: Chromium renders the cover.
    container:
      image: ghcr.io/yciabaud/inkventure-ebook:v1.63.0-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Use the published catalogue
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/catalog/use-published.sh
      - run: npm run ebook
      - uses: actions/upload-artifact@v4
        with:
          name: ebooks
          path: |
            ebook/build/*.epub
            ebook/build/*.azw3
            ebook/build/*-cover.jpg
            ebook/build/books.json
          if-no-files-found: error
