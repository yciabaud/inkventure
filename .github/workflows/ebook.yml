name: Ebook

# Builds the EN and FR ebooks (SPEC §8; story S6.1) on a version tag, on pull requests that change them, or on
# demand: EPUB 3 (Pandoc, checked with EPUBCheck) and AZW3 (Calibre), with game cards from the published catalogue's
# featured lists. The books are uploaded as a workflow artifact; on a version tag, the EPUB and AZW3 files are also
# attached to the tag's GitHub release, with generated release notes (a draft is created when the tag has none yet).
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'ebook/**'
      - 'scripts/ebook/**'
      - '.github/workflows/ebook.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright's image with Pandoc, EPUBCheck and Calibre (.github/ebook-image, published by the Ebook image
    # workflow). Its tag must match @playwright/test: Chromium renders the cover.
    container:
      image: ghcr.io/yciabaud/inkventure-ebook:v1.63.0-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Use the published catalogue
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/catalog/use-published.sh
      - run: npm run ebook
      - uses: actions/upload-artifact@v4
        with:
          name: ebooks
          path: |
            ebook/build/*.epub
            ebook/build/*.azw3
            ebook/build/*-cover.jpg
            ebook/build/books.json
          if-no-files-found: error

  # On a version tag only: attach the books to the tag's release, replacing files of the same name (a re-run), and
  # write its notes (scripts/release/, story S7.5; docs/releases/ says what they hold). A tag pushed with git gets a
  # draft release with those notes, published by the owner after a read. A release created with the tag (GitHub UI)
  # gets them only if its notes are empty; the job summary always shows them.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ebook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The previous tag and its backlog, for the stories done since then.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The app as the release deploys it, for the first-load sizes.
      - run: scripts/catalog/use-published.sh
      - run: npm run build
      - run: npm run check:size -- --json release-sizes.json
      - uses: actions/download-artifact@v4
        with:
          name: ebooks
          path: ebooks
      - name: Write the release notes
        run: |
          npm run release:notes -- --tag "$GITHUB_REF_NAME" --sizes release-sizes.json --books ebooks/books.json \
            --out release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the books and the notes to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s failglob
          files=(ebooks/*.epub ebooks/*.azw3)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file release-notes.md
            else
              echo 'The release already has notes: left as they are (the generated ones are in the job summary).'
            fi
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag --title "Inkventure $TAG" \
              --notes-file release-notes.md
          fi
