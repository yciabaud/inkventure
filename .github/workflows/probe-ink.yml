# TEMPORARY (S2.7 first step): counts the ink games from CI, where IFDB and the IF Archive are reachable. Removed
# before merge.
name: Probe ink games
on:
  pull_request:
    paths: ['.github/probe/**', '.github/workflows/probe-ink.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cached IFDB records (catalog branch)
        run: git fetch --quiet origin catalog && git worktree add catalog-data FETCH_HEAD
      - run: node .github/probe/ink-count.ts
