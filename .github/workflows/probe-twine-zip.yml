# TEMPORARY (S1.11): inspects the real Twine zip from CI, where the IF Archive is reachable, and plays it through the
# app. Removed before merge.
name: Probe Twine zip
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && git fetch origin catalog
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node .github/probe/twine-zip.mjs
      - run: npx playwright test --config .github/probe/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jeangille-screenshots
          path: test-results/*.png
          retention-days: 3
